create_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: webastoconnect
    start_time:
      required: true
      selector:
        time:
    duration_minutes:
      required: true
      selector:
        number:
          min: 1
          max: 1440
          mode: box
    repeat_days:
      required: false
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    enabled:
      required: false
      default: true
      selector:
        boolean:
    location:
      required: false
      selector:
        location:

update_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: webastoconnect
    timer_index:
      required: true
      selector:
        number:
          min: 0
          mode: box
    start_time:
      required: false
      selector:
        time:
    duration_minutes:
      required: false
      selector:
        number:
          min: 1
          max: 1440
          mode: box
    repeat_days:
      required: false
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    enabled:
      required: false
      selector:
        boolean:
    clear_location:
      required: false
      selector:
        boolean:
    location:
      required: false
      selector:
        location:

delete_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: webastoconnect
    timer_index:
      required: true
      selector:
        number:
          min: 0
          mode: box
